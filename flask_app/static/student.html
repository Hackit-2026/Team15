<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>講義フィードバック</title>

<script src="common.js"></script>

<style>
  /* ============================================
     学生側のデザイン方針（教員側とは別系統・意図的）
     やわらかい背景 / 丸みの強い形 / 余白多め。
     授業中に緊張せず押せることを優先している。
     ============================================ */

  :root {
    --ink:       #4a4550;   /* 本文。真っ黒は硬いので少し紫寄りに */
    --ink-soft:  #8b8494;   /* 補足文 */
    --coral:     #f2706b;   /* 分からん。共通定義 #e05555 と同系統 */
    --coral-deep:#e05555;
    --card:      #ffffff;
    --radius:    28px;
  }

  * { box-sizing: border-box; }

  body {
    font-family: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN",
                 "Yu Gothic", "游ゴシック体", sans-serif;
    margin: 0;
    padding: 20px 18px 40px;
    color: var(--ink);
    background: #fdf6f3;
    -webkit-tap-highlight-color: transparent;
    min-height: 100vh;
  }

  /* 背景のやわらかい色だまり。動かないので邪魔にならない程度に */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(circle at 12% 0%,   #ffe3dc 0%, transparent 45%),
      radial-gradient(circle at 92% 12%,  #e2ecff 0%, transparent 42%),
      radial-gradient(circle at 50% 100%, #fdf1e6 0%, transparent 55%);
  }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 28px 24px;
    margin-bottom: 18px;
    box-shadow: 0 6px 24px rgba(120, 96, 110, 0.08);
  }

  h2 {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 14px;
    letter-spacing: 0.02em;
  }

  /* --- 画面の出し分け --- */
  .screen { display: none; }
  .screen.active { display: block; }

  .note {
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.9;
  }

  /* --- 汎用ボタン（入口・フォーム用） --- */
  .btn {
    display: block;
    width: 100%;
    padding: 18px;
    font-size: 17px;
    font-weight: 700;
    font-family: inherit;
    color: #fff;
    border: none;
    border-radius: 999px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .btn:active { transform: scale(0.97); }

  .btn-login {
    background: linear-gradient(135deg, #7d7391, #625a75);
    box-shadow: 0 6px 16px rgba(98, 90, 117, 0.28);
  }
  .btn-register {
    background: linear-gradient(135deg, #8fb4f5, #6f92e8);
    box-shadow: 0 6px 16px rgba(111, 146, 232, 0.28);
  }
  .btn-anon {
    background: none;
    color: var(--ink-soft);
    box-shadow: none;
    border: 2px solid #ece4ea;
  }

  /* --- 「分からん」の大きな円ボタン --- */
  .press-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px 0 4px;
  }
  .press-wrap {
    position: relative;
    width: 232px;
    height: 232px;
    display: grid;
    place-items: center;
  }
  .press-btn {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 50%;
    font-family: inherit;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #fff;
    cursor: pointer;
    background: linear-gradient(145deg, #ff9086, var(--coral-deep));
    box-shadow:
      0 14px 30px rgba(224, 85, 85, 0.34),
      inset 0 -6px 14px rgba(0, 0, 0, 0.10),
      inset 0 6px 14px rgba(255, 255, 255, 0.28);
    transition: transform 0.14s cubic-bezier(.34,1.56,.64,1), box-shadow 0.14s ease;
  }
  .press-btn:active {
    transform: scale(0.93);
    box-shadow: 0 6px 14px rgba(224, 85, 85, 0.30);
  }
  .press-btn:disabled {
    background: linear-gradient(145deg, #e6dfe4, #cfc6cf);
    color: #fff;
    font-size: 24px;
    box-shadow: 0 6px 16px rgba(150, 140, 150, 0.18);
    cursor: default;
  }

  /* 押した瞬間に広がる波紋 */
  .ripple {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 3px solid var(--coral);
    opacity: 0;
    pointer-events: none;
  }
  .press-wrap.is-pressed .ripple {
    animation: ripple 0.65s ease-out;
  }
  @keyframes ripple {
    0%   { transform: scale(1);    opacity: 0.55; }
    100% { transform: scale(1.45); opacity: 0; }
  }

  /* --- ログイン・登録フォーム --- */
  .field {
    display: block;
    width: 100%;
    font-size: 16px;
    font-family: inherit;
    color: var(--ink);
    padding: 16px 18px;
    margin-bottom: 12px;
    background: #faf7f9;
    border: 2px solid #f0e9ee;
    border-radius: 18px;
    transition: border-color 0.15s, background 0.15s;
  }
  .field:focus {
    outline: none;
    background: #fff;
    border-color: #c8b8d8;
  }
  .field::placeholder { color: #c3bcc8; }

  .err {
    color: #d4574f;
    font-size: 14px;
    min-height: 1.3em;
    margin: 0 0 10px;
  }

  /* --- 押した直後のトースト --- */
  #toast {
    position: fixed;
    left: 50%;
    bottom: 36px;
    transform: translateX(-50%) translateY(8px);
    background: rgba(74, 69, 80, 0.92);
    color: #fff;
    padding: 14px 28px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 700;
    opacity: 0;
    transition: opacity 0.25s, transform 0.25s;
    pointer-events: none;
    box-shadow: 0 8px 20px rgba(74, 69, 80, 0.25);
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* --- 自分の記録 --- */
  .log-item {
    padding: 18px 0;
    border-bottom: 1px solid #f4eef2;
    font-size: 16px;
  }
  .log-item:last-child { border-bottom: none; padding-bottom: 4px; }

  .log-head {
    display: flex;
    align-items: center;
  }
  .log-time {
    width: 72px;
    font-weight: 700;
    font-size: 17px;
  }
  .log-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    margin-right: 12px;
    flex: none;
  }

  /* --- 進捗バー（講義100分のどのあたりか） --- */
  .bar {
    position: relative;
    height: 8px;
    background: #f4eef2;
    border-radius: 999px;
    margin: 14px 0 0 24px;
  }
  .bar-mark {
    position: absolute;
    top: -3px;
    width: 14px; height: 14px;
    border-radius: 50%;
    transform: translateX(-50%);
    border: 3px solid #fff;
    box-shadow: 0 2px 6px rgba(224, 85, 85, 0.35);
  }
  .bar-ends {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #c3bcc8;
    margin: 6px 0 0 24px;
  }

  /* --- メモ --- */
  .memo {
    width: calc(100% - 24px);
    margin: 14px 0 0 24px;
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
    padding: 12px 14px;
    background: #faf7f9;
    border: 2px solid #f0e9ee;
    border-radius: 16px;
    resize: vertical;
    min-height: 46px;
  }
  .memo:focus {
    outline: none;
    background: #fff;
    border-color: #c8b8d8;
  }
  .memo::placeholder { color: #c9c2ce; }

  /* --- 講義名（タブの上に常に出す） --- */
  .lecture-title {
    font-size: 21px;
    font-weight: 700;
    margin: 6px 6px 4px;
    letter-spacing: 0.02em;
  }
  .lecture-cap {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: #c3bcc8;
    margin: 0 6px 14px;
  }

  /* --- タブ（押す / 記録） --- */
  /* 授業中は「押すだけ」にしたいので、記録は別タブに隠す。
     授業の終了で切り替えると教員の操作待ちになってしまうため、
     学生が自分で切り替えるタブにしている。 */
  .tabs {
    display: flex;
    background: rgba(255, 255, 255, 0.75);
    border-radius: 999px;
    padding: 5px;
    margin-bottom: 18px;
    box-shadow: 0 4px 16px rgba(120, 96, 110, 0.07);
  }
  .tab {
    flex: 1;
    padding: 13px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    color: var(--ink-soft);
    background: none;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.18s, color 0.18s;
  }
  .tab.active {
    background: linear-gradient(135deg, #7d7391, #625a75);
    color: #fff;
    box-shadow: 0 4px 12px rgba(98, 90, 117, 0.24);
  }
  .badge {
    display: inline-block;
    min-width: 20px;
    padding: 0 6px;
    margin-left: 7px;
    font-size: 12px;
    line-height: 20px;
    border-radius: 999px;
    background: var(--coral);
    color: #fff;
  }
  .tab.active .badge { background: rgba(255,255,255,0.9); color: #625a75; }

  /* --- 仮データで動いているときの表示 --- */
  #mockBanner {
    background: rgba(74, 69, 80, 0.9);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    text-align: center;
    padding: 10px;
    border-radius: 999px;
    margin-bottom: 14px;
  }

  .sub {
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 22px;
    line-height: 2;
  }
  .sub a {
    color: var(--ink-soft);
    text-underline-offset: 4px;
    margin: 0 6px;
  }

  #error {
    color: #d4574f;
    font-size: 14px;
    text-align: center;
  }

  /* 画面が広いときは中央に寄せる（発表でPCに映す場合の保険） */
  @media (min-width: 560px) {
    body { padding: 32px 0 60px; }
    .screen { max-width: 480px; margin: 0 auto; }
  }
</style>
</head>
<body>

<!-- ① 入口：ログインするかどうか選ぶ（未ログインのときだけ出る） -->
<div class="screen" id="screenChoice">
  <div class="card">
    <h2>記録を残しますか？</h2>
    <p class="note">
      ログインすると、自分が押した記録が復習リストとして残ります。<br>
      名前やメールアドレスは必要ありません。<br>
      ログインしなくても押せます。その場合の記録は完全に匿名です。
    </p>

    <button class="btn btn-login"    onclick="showScreen('screenLogin')">ログインして記録を残す</button>
    <button class="btn btn-register" onclick="showScreen('screenRegister')">新規登録する</button>
    <button class="btn btn-anon"     onclick="useAnonymous()">ログインせずに使う</button>
  </div>
</div>


<!-- ② ログイン -->
<div class="screen" id="screenLogin">
  <div class="card">
    <h2>ログイン</h2>
    <form onsubmit="doLogin(); return false;">
      <input class="field" type="text"     id="loginUsername" placeholder="ユーザー名" autocomplete="username">
      <input class="field" type="password" id="loginPassword" placeholder="パスワード" autocomplete="current-password">
      <p class="err" id="loginError"></p>
      <button class="btn btn-login" type="submit">ログイン</button>
    </form>
    <div class="sub">
      <a href="#" onclick="showScreen('screenRegister');return false;">アカウントを作る</a>
      <a href="#" onclick="showScreen('screenChoice');return false;">戻る</a>
    </div>
  </div>
</div>


<!-- ③ 新規登録 -->
<div class="screen" id="screenRegister">
  <div class="card">
    <h2>新規登録</h2>
    <p class="note">
      ユーザー名とパスワードだけで登録できます。<br>
      本名でなくて構いません。
    </p>
    <form onsubmit="doRegister(); return false;">
      <input class="field" type="text"     id="regUsername" placeholder="ユーザー名" autocomplete="username">
      <input class="field" type="password" id="regPassword" placeholder="パスワード" autocomplete="new-password">
      <input class="field" type="email"    id="regEmail"    placeholder="メールアドレス（任意）" autocomplete="email">
      <p class="err" id="regError"></p>
      <button class="btn btn-register" type="submit">登録して始める</button>
    </form>
    <div class="sub">
      <a href="#" onclick="showScreen('screenLogin');return false;">ログインはこちら</a>
      <a href="#" onclick="showScreen('screenChoice');return false;">戻る</a>
    </div>
  </div>
</div>


<!-- ④ メイン：ボタン3つ ＋ 自分の記録 -->
<div class="screen" id="screenMain">

  <div id="mockBanner" style="display:none">
    仮データで動いています（サーバーには保存されません）
  </div>

  <p class="lecture-cap">LECTURE</p>
  <h2 class="lecture-title" id="lectureTitle">講義</h2>

  <div class="tabs">
    <button class="tab active" id="tabBtnPress" onclick="switchTab('press')">押す</button>
    <button class="tab"        id="tabBtnLog"   onclick="switchTab('log')">記録<span class="badge" id="logCount" style="display:none">0</span></button>
  </div>

  <!-- 「押す」タブ：授業中はこれだけ見えていればいい -->
  <div id="tabPress">
    <div class="card">
      <div class="press-area">
        <div class="press-wrap" id="pressWrap">
          <span class="ripple"></span>
          <button class="press-btn" id="btn-wakaran" onclick="press()">分からん</button>
        </div>
      </div>

      <p class="note" style="text-align:center" id="pressNote"></p>
      <div id="error"></div>
    </div>
  </div>

  <!-- 「記録」タブ：授業のあとで見る復習用 -->
  <div id="tabLog" style="display:none">
    <div class="card">
      <h2>今日押した記録</h2>
      <p class="note">授業のあとで、思い出せることをメモしておくと復習に使えます。</p>
      <div id="log"></div>
    </div>
  </div>

  <div class="sub" id="loginStatus"></div>

</div>


<div id="toast"></div>


<script>
// ============================================
// 状態
// ============================================
let sid = null;            // 部屋ID（QRの ?sid=）
let currentUser = null;    // ログイン中なら {id, username}、匿名なら null
let myPresses = [];        // 自分が押した記録（ログイン中のみ使う）
const COOLDOWN_SEC = 30;   // 連打防止の秒数

// ローカル控え（localStorage）の持ち主を表すキー
function userKey() {
  return "user:" + currentUser.id;
}


// ============================================
// 起動時
// ============================================
window.onload = async function () {
  sid = getSidFromUrl();

  if (!sid) {
    document.body.innerHTML =
      '<div class="card">QRコードを読み直してください</div>';
    return;
  }

  // ログイン状態を確認する。GET /api/me が
  // {"user": {id, username, ...}} か {"user": null} を返す。
  try {
    const me = await apiGet("/api/me");
    currentUser = me.user;
  } catch (e) {
    currentUser = null;   // サーバーに繋がらなくても匿名で押す画面までは行ける
  }

  if (currentUser) {
    startMain();
  } else {
    showScreen("screenChoice");
  }
};

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(el => el.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

// 「押す」と「記録」の切り替え。授業中は「押す」だけを見せたいので既定は押す。
function switchTab(name) {
  const isPress = (name === "press");
  document.getElementById("tabPress").style.display = isPress ? "block" : "none";
  document.getElementById("tabLog").style.display   = isPress ? "none"  : "block";
  document.getElementById("tabBtnPress").classList.toggle("active", isPress);
  document.getElementById("tabBtnLog").classList.toggle("active", !isPress);
}


// ============================================
// ログイン / 登録 / 匿名で使う
// ============================================
async function doLogin() {
  const username = document.getElementById("loginUsername").value.trim();
  const password = document.getElementById("loginPassword").value;
  const errEl = document.getElementById("loginError");

  if (!username || !password) {
    errEl.textContent = "ユーザー名とパスワードを入力してください";
    return;
  }

  try {
    currentUser = await apiPostForm("/api/login", { username: username, password: password });
    errEl.textContent = "";
    startMain();
  } catch (e) {
    errEl.textContent = e.message;
  }
}

async function doRegister() {
  const username = document.getElementById("regUsername").value.trim();
  const password = document.getElementById("regPassword").value;
  let email = document.getElementById("regEmail").value.trim();
  const errEl = document.getElementById("regError");

  if (!username || !password) {
    errEl.textContent = "ユーザー名とパスワードを入力してください";
    return;
  }

  // バックエンドが email の重複を弾くため、空のまま2人目が登録すると
  // 「既に使われています」になってしまう。空欄のときはユーザー名から
  // 一意なダミーを作って回避する（username が unique なので衝突しない）。
  if (!email) {
    email = username + "@no-email.local";
  }

  try {
    await apiPostForm("/api/register", { username: username, email: email, password: password });
    // register はセッションを作らないので、続けてログインする
    currentUser = await apiPostForm("/api/login", { username: username, password: password });
    errEl.textContent = "";
    startMain();
  } catch (e) {
    errEl.textContent = e.message;
  }
}

function useAnonymous() {
  currentUser = null;
  startMain();
}

async function logout() {
  try {
    await apiPostForm("/api/logout", {});
  } catch (e) {
    // ログアウトの失敗は握りつぶしてよい（リロードで状態が揃う）
  }
  location.reload();
}


// ============================================
// メイン画面の開始
// ============================================
async function startMain() {
  showScreen("screenMain");
  switchTab("press");   // どの経路から来ても、授業中の既定は「押す」
  renderLoginStatus();

  if (IS_MOCK) {
    document.getElementById("mockBanner").style.display = "block";
  }

  try {
    // 部屋の情報を取る。返り値は {id, name, isFinished}
    const s = await apiGet("/api/room/" + sid);
    document.getElementById("lectureTitle").textContent = s.name;
  } catch (e) {
    showError(e.message);
  }

  if (currentUser) {
    loadMyPresses();
  } else {
    renderLog();
  }
}

function renderLoginStatus() {
  const el = document.getElementById("loginStatus");
  const note = document.getElementById("pressNote");

  if (currentUser) {
    el.innerHTML = 'ログイン中：<b></b>　' +
      '<a href="#" onclick="logout();return false;">ログアウト</a>';
    el.querySelector("b").textContent = currentUser.username;
    note.textContent = "押した記録はあなたの復習リストに残ります";
  } else {
    el.innerHTML = '匿名で利用中　' +
      '<a href="#" onclick="showScreen(\'screenChoice\');return false;">ログインする</a>';
    note.textContent = "ログインしていないので、押した記録は完全に匿名です";
  }
}


// ============================================
// ボタンを押したとき
// ============================================
async function press() {
  const type = PRESS_TYPES.WAKARAN;
  const btn = document.getElementById("btn-" + type);

  // すぐ反応を返す（体感速度が大事）
  toast("記録しました");
  if (navigator.vibrate) navigator.vibrate(50);
  playRipple();
  startCooldown(btn, type);

  try {
    // 誰が押したかはサーバーがセッションで判別する。
    // type はサーバーが捨てているが、講義側が種類別の集計を求めているので
    // 送るだけ送っておく（保存対応が入ればそのまま効き始める）。
    const res = await apiPostForm("/api/reaction/" + sid, { type: type });
    clearError();

    if (!currentUser) return;   // 匿名のときは手元に何も残さない

    // 経過時間はサーバーが計算して返す（端末の時計はズレるため）。
    // 万一返ってこなかった時だけ、この端末での暫定計算に落とす。
    const p = {
      id: res.reaction_id,
      type: type,
      elapsed_sec: res.elapsed_sec != null ? res.elapsed_sec : localElapsedSec(sid),
    };
    myPresses.push(p);
    saveMyPressLocal(sid, userKey(), p);   // 通信できない時のための控え
    renderLog();
  } catch (e) {
    showError(e.message);
  }
}


// 押した瞬間に円ボタンから波紋を広げる。
// クラスを付け直すためにいったん外して、再描画を挟んでから付ける。
function playRipple() {
  const wrap = document.getElementById("pressWrap");
  if (!wrap) return;
  wrap.classList.remove("is-pressed");
  void wrap.offsetWidth;
  wrap.classList.add("is-pressed");
}


// ============================================
// 30秒クールダウン
// ============================================
function startCooldown(btn, type) {
  btn.disabled = true;
  let left = COOLDOWN_SEC;
  btn.textContent = "あと" + left + "秒";

  const t = setInterval(() => {
    left--;
    if (left <= 0) {
      clearInterval(t);
      btn.disabled = false;
      btn.textContent = TYPE_LABEL[type];
    } else {
      btn.textContent = "あと" + left + "秒";
    }
  }, 1000);
}


// ============================================
// 自分の記録
// ============================================
async function loadMyPresses() {
  try {
    // 取り出しAPIはバックエンドに依頼中で、まだ存在しない。
    // 出来るまでは失敗して下の控えに落ちる（出来たら自動で切り替わる）。
    myPresses = await apiGet("/api/reaction/" + sid + "?user_id=" + currentUser.id);
  } catch (e) {
    // サーバーから取れない時はブラウザに残した控えを出す
    myPresses = loadMyPressesLocal(sid, userKey());
  }
  renderLog();
}

// 画面に出ている順番の記録。メモの保存先を引くのに使う。
let shownPresses = [];

function renderLog() {
  const box = document.getElementById("log");
  const badge = document.getElementById("logCount");

  // 匿名のときは記録が残らないことを伝えるだけ
  if (!currentUser) {
    badge.style.display = "none";
    box.innerHTML =
      '<p class="note">ログインすると、押した記録がここに残って復習に使えます。</p>' +
      '<div class="sub"><a href="#" onclick="showScreen(\'screenChoice\');return false;">ログイン・登録はこちら</a></div>';
    return;
  }

  // 「記録」タブを開かなくても何件たまったか分かるようにする
  badge.textContent = myPresses.length;
  badge.style.display = myPresses.length ? "inline-block" : "none";

  if (myPresses.length === 0) {
    box.innerHTML = '<p class="note">まだ押した記録はありません</p>';
    return;
  }

  shownPresses = myPresses.slice().sort((a, b) => b.elapsed_sec - a.elapsed_sec);

  box.innerHTML = shownPresses.map((p, i) => {
    // 100分の講義のどのあたりで押したか。はみ出さないよう0〜100%に収める。
    const pct = Math.min(100, Math.max(0, p.elapsed_sec / LECTURE_MAX_SEC * 100));

    return `
    <div class="log-item">
      <div class="log-head">
        <div class="log-dot" style="background:${TYPE_COLOR[p.type]}"></div>
        <div class="log-time">${fmtMin(p.elapsed_sec)}</div>
        <div>${TYPE_LABEL[p.type]}</div>
      </div>

      <div class="bar">
        <div class="bar-mark" style="left:${pct}%;background:${TYPE_COLOR[p.type]}"></div>
      </div>
      <div class="bar-ends"><span>開始</span><span>100分</span></div>

      <textarea class="memo"
                placeholder="メモ（何が分からなかった？）"
                onchange="onMemoChange(${i}, this.value)">${escapeHtml(getMemo(sid, p))}</textarea>
    </div>
  `;
  }).join("");
}

function onMemoChange(i, text) {
  const p = shownPresses[i];
  if (p) saveMemo(sid, p, text.trim());
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}


// ============================================
// トースト・エラー
// ============================================
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1200);
}

function showError(msg) {
  document.getElementById("error").textContent = "エラー: " + msg;
}
function clearError() {
  document.getElementById("error").textContent = "";
}
</script>
