<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>講義フィードバック</title>

<script src="common.js"></script>

<style>
  body {
    font-family: sans-serif;
    margin: 0;
    padding: 16px;
    background: #f5f5f5;
    -webkit-tap-highlight-color: transparent;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  h2 { font-size: 18px; margin: 0 0 12px; }

  /* --- 画面の出し分け --- */
  .screen { display: none; }
  .screen.active { display: block; }

  /* --- 匿名アカウントのコード --- */
  .code {
    font-size: 44px;
    font-weight: bold;
    letter-spacing: 6px;
    text-align: center;
    padding: 20px;
    background: #f0f0f0;
    border-radius: 10px;
    margin: 16px 0;
  }
  .note { font-size: 14px; color: #666; line-height: 1.7; }

  /* --- ボタン3つ --- */
  .btn {
    display: block;
    width: 100%;
    height: 88px;
    font-size: 26px;
    font-weight: bold;
    color: #fff;
    border: none;
    border-radius: 12px;
    margin-bottom: 14px;
    cursor: pointer;
    transition: transform 0.08s;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { background: #bbb !important; }

  .btn-wakaran { background: #e05555; }
  .btn-again   { background: #e0a355; }
  .btn-fast    { background: #5580e0; }

  /* --- 押した直後のトースト --- */
  #toast {
    position: fixed;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8);
    color: #fff;
    padding: 12px 24px;
    border-radius: 30px;
    font-size: 16px;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }
  #toast.show { opacity: 1; }

  /* --- 自分の記録 --- */
  .log-item {
    padding: 12px 0;
    border-bottom: 1px solid #eee;
    font-size: 17px;
  }
  .log-head {
    display: flex;
    align-items: center;
  }
  .log-time { width: 70px; color: #666; }
  .log-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    margin-right: 10px;
    flex: none;
  }

  /* --- 進捗バー（講義100分のどのあたりか） --- */
  .bar {
    position: relative;
    height: 6px;
    background: #eee;
    border-radius: 3px;
    margin: 10px 0 0 22px;
  }
  .bar-mark {
    position: absolute;
    top: -3px;
    width: 12px; height: 12px;
    border-radius: 50%;
    transform: translateX(-50%);
    border: 2px solid #fff;
    box-sizing: border-box;
  }
  .bar-ends {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #aaa;
    margin: 4px 0 0 22px;
  }

  /* --- メモ --- */
  .memo {
    width: calc(100% - 22px);
    margin: 10px 0 0 22px;
    box-sizing: border-box;
    font-size: 15px;
    font-family: inherit;
    padding: 8px;
    border: 1px solid #ddd;
    border-radius: 8px;
    resize: vertical;
    min-height: 38px;
  }
  .memo::placeholder { color: #bbb; }

  /* --- 講義名（タブの上に常に出す） --- */
  .lecture-title {
    font-size: 18px;
    margin: 4px 4px 12px;
  }

  /* --- タブ（押す / 記録） --- */
  /* 授業中は「押すだけ」にしたいので、記録は別タブに隠す。
     授業の終了で切り替えると教員の操作待ちになってしまうため、
     学生が自分で切り替えるタブにしている。 */
  .tabs {
    display: flex;
    background: #fff;
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 16px;
  }
  .tab {
    flex: 1;
    padding: 12px;
    font-size: 16px;
    font-weight: bold;
    font-family: inherit;
    color: #888;
    background: none;
    border: none;
    border-radius: 9px;
    cursor: pointer;
  }
  .tab.active {
    background: #333;
    color: #fff;
  }
  .badge {
    display: inline-block;
    min-width: 18px;
    padding: 0 5px;
    margin-left: 6px;
    font-size: 12px;
    line-height: 18px;
    border-radius: 9px;
    background: #e05555;
    color: #fff;
  }
  .tab.active .badge { background: #fff; color: #333; }

  /* --- 仮データで動いているときの表示 --- */
  #mockBanner {
    background: #444;
    color: #fff;
    font-size: 13px;
    text-align: center;
    padding: 8px;
    border-radius: 8px;
    margin-bottom: 12px;
  }

  .sub {
    text-align: center;
    font-size: 13px;
    color: #888;
    margin-top: 20px;
  }
  .sub a { color: #888; }

  input[type="text"] {
    font-size: 24px;
    padding: 12px;
    width: 100%;
    box-sizing: border-box;
    text-align: center;
    letter-spacing: 4px;
    text-transform: uppercase;
  }
  #error { color: #c00; font-size: 14px; }
</style>
</head>
<body>

<!-- ① 初回：匿名アカウントの作成 -->
<div class="screen" id="screenCode">
  <div class="card">
    <h2>匿名アカウントを作成します</h2>
    <p class="note">
      名前もメールアドレスも登録しません。<br>
      下のコードだけであなたの記録を管理します。
    </p>

    <div class="code" id="newCode">------</div>

    <p class="note">
      別の端末から自分の記録を見たいときに使います。<br>
      スクリーンショットを撮っておいてください。
    </p>

    <button class="btn btn-wakaran" onclick="createAccount()">これで始める</button>
    <div class="sub">
      <a href="#" onclick="showScreen('screenRestore');return false;">すでにコードを持っている</a>
    </div>
  </div>
</div>


<!-- ② コードで復元 -->
<div class="screen" id="screenRestore">
  <div class="card">
    <h2>コードを入力</h2>
    <input type="text" id="restoreInput" placeholder="ABC123" maxlength="6">
    <br><br>
    <button class="btn btn-wakaran" onclick="restoreAccount()">復元する</button>
    <div class="sub">
      <a href="#" onclick="showScreen('screenCode');return false;">戻る</a>
    </div>
  </div>
</div>


<!-- ③ メイン：ボタン3つ ＋ 自分の記録 -->
<div class="screen" id="screenMain">

  <div id="mockBanner" style="display:none">
    仮データで動いています（サーバーには保存されません）
  </div>

  <h2 class="lecture-title" id="lectureTitle">講義</h2>

  <div class="tabs">
    <button class="tab active" id="tabBtnPress" onclick="switchTab('press')">押す</button>
    <button class="tab"        id="tabBtnLog"   onclick="switchTab('log')">記録<span class="badge" id="logCount" style="display:none">0</span></button>
  </div>

  <!-- 「押す」タブ：授業中はこれだけ見えていればいい -->
  <div id="tabPress">
    <div class="card">
      <button class="btn btn-wakaran" id="btn-wakaran" onclick="press('wakaran')">分からん</button>
      <button class="btn btn-again"   id="btn-again"   onclick="press('again')">もう一回</button>
      <button class="btn btn-fast"    id="btn-fast"    onclick="press('fast')">速い</button>

      <p class="note" style="text-align:center">
        押した記録が誰のものかは分かりません
      </p>
      <div id="error"></div>
    </div>
  </div>

  <!-- 「記録」タブ：授業のあとで見る復習用 -->
  <div id="tabLog" style="display:none">
    <div class="card">
      <h2>今日押した記録</h2>
      <p class="note">授業のあとで、思い出せることをメモしておくと復習に使えます。</p>
      <div id="log"></div>
    </div>

    <div class="sub">
      あなたのコード：<b id="myCode"></b>
    </div>
  </div>

</div>


<div id="toast"></div>


<script>
// ============================================
// 状態
// ============================================
let sid = null;            // セッションID
let clientId = null;       // 匿名アカウントのコード
let myPresses = [];        // 自分が押した記録
const COOLDOWN_SEC = 30;   // 連打防止の秒数


// ============================================
// 起動時
// ============================================
window.onload = function () {
  sid = getSidFromUrl();

  if (!sid) {
    document.body.innerHTML =
      '<div class="card">QRコードを読み直してください</div>';
    return;
  }

  clientId = getClientId();

  if (clientId) {
    startMain();                                  // 2回目以降
  } else {
    document.getElementById("newCode").textContent = genCode();
    showScreen("screenCode");                     // 初回
  }
};

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(el => el.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

// 「押す」と「記録」の切り替え。授業中は「押す」だけを見せたいので既定は押す。
function switchTab(name) {
  const isPress = (name === "press");
  document.getElementById("tabPress").style.display = isPress ? "block" : "none";
  document.getElementById("tabLog").style.display   = isPress ? "none"  : "block";
  document.getElementById("tabBtnPress").classList.toggle("active", isPress);
  document.getElementById("tabBtnLog").classList.toggle("active", !isPress);
}


// ============================================
// 匿名アカウントの作成 / 復元
// ============================================
function createAccount() {
  clientId = document.getElementById("newCode").textContent;
  saveClientId(clientId);
  startMain();
}

function restoreAccount() {
  const v = document.getElementById("restoreInput").value.trim().toUpperCase();
  if (v.length !== 6) {
    alert("6桁のコードを入力してください");
    return;
  }
  clientId = v;
  saveClientId(clientId);
  startMain();
}


// ============================================
// メイン画面の開始
// ============================================
async function startMain() {
  showScreen("screenMain");
  document.getElementById("myCode").textContent = clientId;

  if (IS_MOCK) {
    document.getElementById("mockBanner").style.display = "block";
  }

  try {
    // 部屋の情報を取る。返り値は {id, name, isFinished}
    const s = await apiGet("/api/room/" + sid);
    document.getElementById("lectureTitle").textContent = s.name;
  } catch (e) {
    showError(e.message);
  }

  loadMyPresses();
}


// ============================================
// ボタンを押したとき
// ============================================
async function press(type) {
  const btn = document.getElementById("btn-" + type);

  // すぐ反応を返す（体感速度が大事）
  toast("記録しました");
  if (navigator.vibrate) navigator.vibrate(50);
  startCooldown(btn, type);

  try {
    const res = await apiPostForm("/api/reaction/" + sid, {
      type: type,
      client_id: clientId,
    });
    clearError();

    // 経過時間はサーバーが計算して返す（端末の時計はズレるため）。
    // 万一返ってこなかった時だけ、この端末での暫定計算に落とす。
    const p = {
      id: res.reaction_id,
      type: type,
      elapsed_sec: res.elapsed_sec != null ? res.elapsed_sec : localElapsedSec(sid),
    };
    myPresses.push(p);
    saveMyPressLocal(sid, clientId, p);   // 通信できない時のための控え
    renderLog();
  } catch (e) {
    showError(e.message);
  }
}


// ============================================
// 30秒クールダウン
// ============================================
function startCooldown(btn, type) {
  btn.disabled = true;
  let left = COOLDOWN_SEC;
  btn.textContent = "あと" + left + "秒";

  const t = setInterval(() => {
    left--;
    if (left <= 0) {
      clearInterval(t);
      btn.disabled = false;
      btn.textContent = TYPE_LABEL[type];
    } else {
      btn.textContent = "あと" + left + "秒";
    }
  }, 1000);
}


// ============================================
// 自分の記録
// ============================================
async function loadMyPresses() {
  try {
    // サーバーから自分の押した分だけ取る（別端末から復元した時もこれで揃う）
    myPresses = await apiGet("/api/reaction/" + sid + "?client_id=" + clientId);
  } catch (e) {
    // サーバーに繋がらない時はブラウザに残した控えを出す
    myPresses = loadMyPressesLocal(sid, clientId);
  }
  renderLog();
}

// 画面に出ている順番の記録。メモの保存先を引くのに使う。
let shownPresses = [];

function renderLog() {
  const box = document.getElementById("log");

  // 「記録」タブを開かなくても何件たまったか分かるようにする
  const badge = document.getElementById("logCount");
  badge.textContent = myPresses.length;
  badge.style.display = myPresses.length ? "inline-block" : "none";

  if (myPresses.length === 0) {
    box.innerHTML = '<p class="note">まだ押した記録はありません</p>';
    return;
  }

  shownPresses = myPresses.slice().sort((a, b) => b.elapsed_sec - a.elapsed_sec);

  box.innerHTML = shownPresses.map((p, i) => {
    // 100分の講義のどのあたりで押したか。はみ出さないよう0〜100%に収める。
    const pct = Math.min(100, Math.max(0, p.elapsed_sec / LECTURE_MAX_SEC * 100));

    return `
    <div class="log-item">
      <div class="log-head">
        <div class="log-dot" style="background:${TYPE_COLOR[p.type]}"></div>
        <div class="log-time">${fmtMin(p.elapsed_sec)}</div>
        <div>${TYPE_LABEL[p.type]}</div>
      </div>

      <div class="bar">
        <div class="bar-mark" style="left:${pct}%;background:${TYPE_COLOR[p.type]}"></div>
      </div>
      <div class="bar-ends"><span>開始</span><span>100分</span></div>

      <textarea class="memo"
                placeholder="メモ（何が分からなかった？）"
                onchange="onMemoChange(${i}, this.value)">${escapeHtml(getMemo(sid, p))}</textarea>
    </div>
  `;
  }).join("");
}

function onMemoChange(i, text) {
  const p = shownPresses[i];
  if (p) saveMemo(sid, p, text.trim());
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}


// ============================================
// トースト・エラー
// ============================================
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1200);
}

function showError(msg) {
  document.getElementById("error").textContent = "エラー: " + msg;
}
function clearError() {
  document.getElementById("error").textContent = "";
}
</script>

</body>
</html>
