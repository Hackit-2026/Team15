<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>講義フィードバック</title>
  <!-- QRの飛び先はこのURL（/room/<id>）のまま。
       参加者に見せる画面を static/student.html に一本化したので、
       ここは sid を付けて橋渡しするだけにしてある。

       元々ここにあった簡易版の参加者画面（🤔わからんボタン、
       participantId / eventId の送信）は student.html 側には無い。
       エフェクト機能でその送信が必要なら言ってください。
       student.html 側に足します（学生画面はこちらの担当）。 -->
  <meta http-equiv="refresh" content="0; url=/static/student.html?sid={{ room_id }}">
</head>
<body>
  <p style="font-family: sans-serif; padding: 16px;">
    <a href="/static/student.html?sid={{ room_id }}">画面が切り替わらない場合はこちら</a>
  </p>
  <script>
    location.replace("/static/student.html?sid={{ room_id }}");
  </script>
</body>
</html>
