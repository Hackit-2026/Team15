<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1 id="room-name"></h1>

  <div id="finished" style="display:none;">
    <h1>この講義は終了しています</h1>
  </div>

  <form id="reaction-form" style="display:none;">
    <button id="confusedButton" type="submit">🤔 わからん</button>
    <p id="reaction-status" role="status"></p>
  </form>

  <script>
    const roomId = "{{ room_id }}";
    const reactionForm = document.getElementById("reaction-form");
    const confusedButton = document.getElementById("confusedButton");
    const reactionStatus = document.getElementById("reaction-status");

    function createId() {
      return globalThis.crypto?.randomUUID?.()
        ?? `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function getParticipantId() {
      const storageKey = "team15-participant-id";
      let participantId = localStorage.getItem(storageKey);
      if (!participantId) {
        participantId = createId();
        localStorage.setItem(storageKey, participantId);
      }
      return participantId;
    }

    async function loadRoom() {
      const res = await fetch(`/api/room/${roomId}`);
      const data = await res.json();

      document.getElementById("room-name").textContent = data.name;
      document.getElementById("finished").style.display = data.isFinished ? "block" : "none";
      reactionForm.style.display = data.isFinished ? "none" : "block";
    }
    loadRoom();

    reactionForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      confusedButton.disabled = true;
      reactionStatus.textContent = "送信中...";
      try {
        const response = await fetch(`/api/reaction/${roomId}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            type: "confused",
            participantId: getParticipantId(),
            eventId: createId(),
          }),
        });
        if (!response.ok) {
          throw new Error();
        }
        reactionStatus.textContent = "🤔 講師に送りました";
      } catch {
        reactionStatus.textContent = "送信できませんでした";
      } finally {
        window.setTimeout(() => {
          confusedButton.disabled = false;
        }, 800);
      }
    });
  </script>
</body>
</html>
