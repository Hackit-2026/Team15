<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>講義フィードバック</title>
  <!-- QRの飛び先はこのURL（/room/<id>）で固定。
       学生画面の実体は static/student.html に一本化してあり、
       ここは sid を付けて橋渡しするだけ。 -->
  <meta http-equiv="refresh" content="0; url=/static/student.html?sid={{ room_id }}">
</head>
<body>
  <p style="font-family: sans-serif; padding: 16px;">
    <a href="/static/student.html?sid={{ room_id }}">画面が切り替わらない場合はこちら</a>
  </p>
  <script>
    location.replace("/static/student.html?sid={{ room_id }}");
  </script>
</body>
</html>
