<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1 id="room-name"></h1>

  <div id="finished" style="display:none;">
    <h1>この講義は終了しています</h1>
  </div>

  <form id="reaction-form" style="display:none;">
    <button type="submit">わからん</button>
  </form>

  <script>
    const roomId = "{{ room_id }}";

    async function loadRoom() {
      const res = await fetch(`/api/room/${roomId}`);
      const data = await res.json();

      document.getElementById("room-name").textContent = data.name;
      document.getElementById("finished").style.display = data.isFinished ? "block" : "none";
      document.getElementById("reaction-form").style.display = data.isFinished ? "none" : "block";
    }
    loadRoom();

    document.getElementById("reaction-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      await fetch(`/api/reaction/${roomId}`, { method: "POST" });
      loadRoom();
    });
  </script>
</body>
</html>
