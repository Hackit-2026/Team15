<!DOCTYPE html>
<html lang="ja">
<head>
    <title>{{ app_name }} - {{ title }}</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PDFプレゼンテーション画面">
    <link rel="stylesheet" href="{{ url_for('static', filename='tutor/presentation.css', v='20260802-2') }}">
    <script src="{{ url_for('static', filename='js/local-effect-settings-adapter.js', v='20260802-1') }}"></script>
    <script type="module" src="{{ url_for('static', filename='dist/presentation.js') }}"></script>
    <script src="{{ url_for('static', filename='js/presentation-reactions.js', v='20260802-9') }}" defer></script>
</head>
<body data-room-id="{{ room_id }}">
    <header class="presentation-header">
        <a href="{{ url_for('tutor.tutor_room', room_id=room_id) }}">← ルーム管理へ戻る</a>
        <span>{{ app_name }} - PDFプレゼンテーション</span>
    </header>

    <main class="presentation-page">
        <section class="pdf-upload-panel" aria-labelledby="pdfUploadTitle">
            <div>
                <p class="presentation-kicker">PDF SLIDES</p>
                <h1 id="pdfUploadTitle">スライドを選択</h1>
                <p>PDFはブラウザ内で読み込みます。最大50MBです。</p>
            </div>
            <label class="pdf-dropzone" id="pdfDropzone" for="pdfFileInput">
                <input id="pdfFileInput" type="file" accept="application/pdf,.pdf">
                <strong>PDFを選択</strong>
                <span>または、ここへドラッグ＆ドロップ</span>
                <small id="selectedFileName">ファイルが選択されていません</small>
            </label>
            <p class="pdf-upload-status" id="pdfUploadStatus" role="status"></p>
            <p class="presentation-error" id="presentationError" role="alert"></p>
        </section>

        <section class="presentation-shell" id="presentationShell" hidden>
            <div class="effect-settings-bar">
                <button
                    class="effect-settings-toggle"
                    id="effectSettingsToggle"
                    type="button"
                    aria-expanded="false"
                    aria-controls="effectSettingsPanel"
                >⚙ 演出設定</button>
                <span id="effectConnectionStatus">バックエンドとの同期を確認中...</span>
            </div>

            <form class="effect-settings-panel" id="effectSettingsPanel" hidden>
                <label class="effect-switch">
                    <input id="emojiEffectEnabled" type="checkbox" checked>
                    <span>🤔をスライド下部から表示</span>
                </label>
                <label class="effect-switch">
                    <input id="crackEffectEnabled" type="checkbox">
                    <span>発動前にヒビを表示</span>
                </label>
                <label class="effect-switch effect-switch--danger">
                    <input id="destructionEnabled" type="checkbox">
                    <span>閾値でスライド破壊を発動</span>
                </label>
                <label class="threshold-field" for="destructionThreshold">
                    <span>発動人数</span>
                    <input id="destructionThreshold" type="number" min="2" max="100" value="5">
                    <span>人</span>
                </label>
                <div class="effect-settings-actions">
                    <button class="effect-save" type="submit">設定を保存</button>
                    <button id="previewReaction" type="button">🤔をテスト</button>
                    <button id="previewDestruction" type="button">破壊をテスト</button>
                </div>
                <p id="effectSettingsMessage" role="status"></p>
            </form>

            <div class="presentation-stage" id="presentationStage">
                <div class="slide-viewport" id="slideViewport">
                    <canvas id="slideCanvas" aria-label="現在のPDFスライド"></canvas>
                    <div class="slide-crack-layer" id="slideCrackLayer" aria-hidden="true"></div>
                    <div class="reaction-emoji-layer" id="reactionEmojiLayer" aria-hidden="true"></div>
                    <div class="slide-destruction-layer" id="slideDestructionLayer" aria-hidden="true"></div>
                    <div class="reaction-meter" id="reactionMeter" aria-live="polite">🤔 0 / 5人</div>
                </div>

                <section
                    class="presentation-qr-overlay"
                    id="presentationQrOverlay"
                    role="dialog"
                    aria-modal="true"
                    aria-labelledby="presentationQrTitle"
                    hidden
                >
                    <div class="presentation-qr-card">
                        <button
                            class="presentation-qr-close"
                            id="closePresentationQr"
                            type="button"
                            aria-label="QRコードを閉じる"
                        >×</button>
                        <p class="presentation-qr-kicker">JOIN THIS ROOM</p>
                        <h2 id="presentationQrTitle">スマートフォンで参加</h2>
                        <div class="presentation-qr-image-frame">
                            <img id="presentationQrImage" alt="参加者用URLのQRコード" hidden>
                            <p id="presentationQrStatus">QRコードを読み込んでいます...</p>
                        </div>
                        <p class="presentation-qr-url" id="presentationQrUrl"></p>
                    </div>
                </section>

                <div class="presentation-controls" aria-label="プレゼンテーション操作">
                    <button id="previousSlide" type="button">← 前へ</button>
                    <p><strong id="currentPage">1</strong> / <span id="totalPages">0</span></p>
                    <button id="nextSlide" type="button">次へ →</button>
                    <button id="toggleFullscreen" type="button">全画面</button>
                    <button id="togglePresentationQr" type="button" aria-expanded="false">QR表示</button>
                    <button
                        class="presentation-share"
                        id="openPresentationShare"
                        type="button"
                    >参加者に共有</button>
                    <button
                        class="presentation-project"
                        id="openProjection"
                        type="button"
                        data-projection-url="{{ url_for('static', filename='tutor-projection.html') }}"
                    >別画面でプレゼン</button>
                    <button class="presentation-start" id="startPresentation" type="button">プレゼン開始</button>
                    <button class="presentation-end" id="endPresentation" type="button" hidden>終了</button>
                </div>
            </div>
            <p class="presentation-help">← → でページ移動、Fで全画面、Escで終了</p>
        </section>
    </main>
</body>
</html>
