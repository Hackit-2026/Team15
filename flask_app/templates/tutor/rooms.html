<!DOCTYPE html>
<html lang="ja">
<head>
    <title>{{ app_name }} - {{ title }}</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="担当講義のわからん統計">
    <link rel="stylesheet" href="{{ url_for('static', filename='tutor/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='tutor/rooms.css') }}">
    <script src="{{ url_for('static', filename='js/rooms.js') }}" defer></script>
</head>
<body>
    <header class="site-header">
        <a class="product-name" href="{{ url_for('tutor.tutor_main') }}">{{ app_name }}</a>
        <nav class="navigation" aria-label="メインナビゲーション">
            <a href="{{ url_for('tutor.tutor_main') }}">ホーム</a>
            <a class="is-current" href="{{ url_for('tutor.tutor_rooms') }}">講義一覧</a>
            <details class="account-menu">
                <summary>
                    <span id="tutorUsername">講師</span>さん
                    <span class="account-menu__chevron" aria-hidden="true"></span>
                </summary>
                <div class="account-menu__panel">
                    <a href="{{ url_for('pages.mypage') }}">マイページ</a>
                    <button id="logoutLink" type="button">ログアウト</button>
                </div>
            </details>
        </nav>
    </header>

    <main class="content rooms-page">
        <section class="rooms-heading">
            <div>
                <p class="section-kicker">LECTURE ANALYTICS</p>
                <h1>講義別の「わからん」統計</h1>
                <p>担当している講義の反応数を比較し、理解が難しかった授業を確認できます。</p>
            </div>
        </section>

        <p class="rooms-message" id="roomsMessage" role="status" aria-live="polite"></p>

        <section class="analytics-summary" aria-label="講義統計の概要">
            <article class="analytics-summary-card">
                <span>担当講義</span>
                <p><strong id="totalRoomCount">—</strong>件</p>
            </article>
            <article class="analytics-summary-card">
                <span>わからん総数</span>
                <p><strong id="totalReactionCount">—</strong>件</p>
            </article>
            <article class="analytics-summary-card">
                <span>1講義あたり</span>
                <p><strong id="averageReactionCount">—</strong>件</p>
            </article>
            <article class="analytics-summary-card analytics-summary-card--highlight">
                <span>最も反応が多い講義</span>
                <p class="most-confusing-name" id="mostConfusingRoomName">—</p>
                <small id="mostConfusingRoomCount">0件の反応</small>
            </article>
        </section>

        <section class="rooms-list-section" aria-labelledby="roomsListTitle">
            <div class="rooms-list-heading">
                <div>
                    <p class="section-kicker">LECTURES</p>
                    <h2 id="roomsListTitle">担当講義</h2>
                </div>
                <div class="room-filters" aria-label="講義の絞り込み">
                    <button class="is-active" type="button" data-filter="all">すべて</button>
                    <button type="button" data-filter="active">開講中</button>
                    <button type="button" data-filter="finished">終了</button>
                </div>
            </div>

            <div class="rooms-loading" id="roomsLoading">講義と反応数を読み込んでいます...</div>
            <div class="analytics-room-list" id="roomsGrid" hidden></div>
            <div class="rooms-empty" id="roomsEmpty" hidden>
                <strong>表示できる講義がありません</strong>
                <p>ホームからルームを作成すると、ここに統計が表示されます。</p>
            </div>
        </section>
    </main>
</body>
</html>
