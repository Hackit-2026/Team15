<!DOCTYPE html>
<html lang="ja">
<head>
    <title>{{ app_name }} - {{ title }}</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='tutor/style.css') }}">
    <script src="{{ url_for('static', filename='js/tutor-room.js') }}" defer></script>
</head>
<body data-room-id="{{ room_id }}">
    <header class="site-header">
        <a class="product-name" href="{{ url_for('tutor.tutor_main') }}">{{ app_name }} - {{ title }}</a>
        <nav class="navigation" aria-label="メインナビゲーション">
            <a href="{{ url_for('tutor.tutor_main') }}">ホーム</a>
            <a href="{{ url_for('tutor.tutor_main') }}">授業一覧</a>
            <details class="account-menu">
                <summary>
                    <span id="tutorUsername">講師</span>さん
                    <span class="account-menu__chevron" aria-hidden="true"></span>
                </summary>
                <div class="account-menu__panel">
                    <a href="{{ url_for('pages.mypage') }}">マイページ</a>
                    <button id="logoutLink" type="button">ログアウト</button>
                </div>
            </details>
        </nav>
    </header>

    <main class="content">
        <section class="room-panel">
            <div class="room-panel__heading">
                <div>
                    <p class="room-panel__eyebrow">現在のルーム</p>
                    <h1 id="roomName">読み込み中...</h1>
                </div>
                <div class="room-panel__heading-actions">
                    <span class="room-status" id="roomStatus">確認中</span>
                    <button class="primary-button" id="openShareWindow" type="button" disabled>参加者に共有</button>
                </div>
            </div>

            <form id="closeRoomForm" class="room-panel__actions">
                <a class="secondary-button" href="{{ url_for('tutor.tutor_main') }}">ホームに戻る</a>
                <a class="primary-button" href="{{ url_for('tutor.tutor_room_presentation', room_id=room_id) }}">プレゼンテーション</a>
                <button class="danger-button" id="closeRoomButton" type="submit">講義を終了する</button>
            </form>
            <p class="room-panel__message" id="roomMessage" role="status"></p>
        </section>
    </main>

</body>
</html>
