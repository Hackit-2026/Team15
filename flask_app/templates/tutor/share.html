<!DOCTYPE html>
<html lang="ja">
<head>
    <title>{{ app_name }} - {{ title }}</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="参加者向けルーム共有画面">
    <link rel="stylesheet" href="{{ url_for('static', filename='tutor/style.css') }}">
    <script src="{{ url_for('static', filename='js/tutor-share.js') }}" defer></script>
</head>
<body class="share-window" data-room-id="{{ room_id }}">
    <main class="share-window__content">
        <article class="share-window-card">
            <header class="share-window-card__heading">
                <div>
                    <p class="section-kicker">JOIN THIS ROOM</p>
                    <h1>参加者に共有</h1>
                </div>
                <span class="room-status" id="shareRoomStatus">確認中</span>
            </header>

            <div class="share-window-card__body">
                <section class="share-window-card__qr" aria-labelledby="qrCodeTitle">
                    <h2 id="qrCodeTitle">QRコード</h2>
                    <div class="qr-code-frame">
                        <img id="roomQrCode" alt="参加者用URLのQRコード" hidden>
                        <p id="qrCodePlaceholder">QRコードを読み込んでいます...</p>
                    </div>
                    <p>スマートフォンのカメラで読み取ってください</p>
                </section>

                <section class="share-window-card__details">
                    <p class="share-window-card__label">参加するルーム</p>
                    <h2 id="shareRoomName">読み込み中...</h2>
                    <p class="share-window-card__room-id">ルームID <strong>{{ room_id }}</strong></p>

                    <label for="studentRoomUrl">参加者用URL</label>
                    <input id="studentRoomUrl" type="text" readonly>
                    <button class="primary-button" id="copyRoomUrl" type="button">URLをコピー</button>
                    <p class="share-window-card__message" id="shareMessage" role="status" aria-live="polite"></p>
                </section>
            </div>
        </article>
    </main>
</body>
</html>
