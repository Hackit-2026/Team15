<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>講義フィードバック</title>

<script src="common.js"></script>

<style>
  body {
    font-family: sans-serif;
    margin: 0;
    padding: 16px;
    background: #f5f5f5;
    -webkit-tap-highlight-color: transparent;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  h2 { font-size: 18px; margin: 0 0 12px; }

  /* --- 画面の出し分け --- */
  .screen { display: none; }
  .screen.active { display: block; }

  /* --- 匿名アカウントのコード --- */
  .code {
    font-size: 44px;
    font-weight: bold;
    letter-spacing: 6px;
    text-align: center;
    padding: 20px;
    background: #f0f0f0;
    border-radius: 10px;
    margin: 16px 0;
  }
  .note { font-size: 14px; color: #666; line-height: 1.7; }

  /* --- ボタン3つ --- */
  .btn {
    display: block;
    width: 100%;
    height: 88px;
    font-size: 26px;
    font-weight: bold;
    color: #fff;
    border: none;
    border-radius: 12px;
    margin-bottom: 14px;
    cursor: pointer;
    transition: transform 0.08s;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { background: #bbb !important; }

  .btn-wakaran { background: #e05555; }
  .btn-again   { background: #e0a355; }
  .btn-fast    { background: #5580e0; }

  /* --- 押した直後のトースト --- */
  #toast {
    position: fixed;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8);
    color: #fff;
    padding: 12px 24px;
    border-radius: 30px;
    font-size: 16px;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }
  #toast.show { opacity: 1; }

  /* --- 自分の記録 --- */
  .log-item {
    display: flex;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
    font-size: 17px;
  }
  .log-time { width: 70px; color: #666; }
  .log-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    margin-right: 10px;
  }

  .sub {
    text-align: center;
    font-size: 13px;
    color: #888;
    margin-top: 20px;
  }
  .sub a { color: #888; }

  input[type="text"] {
    font-size: 24px;
    padding: 12px;
    width: 100%;
    box-sizing: border-box;
    text-align: center;
    letter-spacing: 4px;
    text-transform: uppercase;
  }
  #error { color: #c00; font-size: 14px; }
</style>
</head>
<body>

<!-- ① 初回：匿名アカウントの作成 -->
<div class="screen" id="screenCode">
  <div class="card">
    <h2>匿名アカウントを作成します</h2>
    <p class="note">
      名前もメールアドレスも登録しません。<br>
      下のコードだけであなたの記録を管理します。
    </p>

    <div class="code" id="newCode">------</div>

    <p class="note">
      別の端末から自分の記録を見たいときに使います。<br>
      スクリーンショットを撮っておいてください。
    </p>

    <button class="btn btn-wakaran" onclick="createAccount()">これで始める</button>
    <div class="sub">
      <a href="#" onclick="showScreen('screenRestore');return false;">すでにコードを持っている</a>
    </div>
  </div>
</div>


<!-- ② コードで復元 -->
<div class="screen" id="screenRestore">
  <div class="card">
    <h2>コードを入力</h2>
    <input type="text" id="restoreInput" placeholder="ABC123" maxlength="6">
    <br><br>
    <button class="btn btn-wakaran" onclick="restoreAccount()">復元する</button>
    <div class="sub">
      <a href="#" onclick="showScreen('screenCode');return false;">戻る</a>
    </div>
  </div>
</div>


<!-- ③ メイン：ボタン3つ ＋ 自分の記録 -->
<div class="screen" id="screenMain">

  <div class="card">
    <h2 id="lectureTitle">講義</h2>

    <button class="btn btn-wakaran" id="btn-wakaran" onclick="press('wakaran')">分からん</button>
    <button class="btn btn-again"   id="btn-again"   onclick="press('again')">もう一回</button>
    <button class="btn btn-fast"    id="btn-fast"    onclick="press('fast')">速い</button>

    <p class="note" style="text-align:center">
      押した記録が誰のものかは分かりません
    </p>
    <div id="error"></div>
  </div>

  <div class="card">
    <h2>今日押した記録</h2>
    <div id="log"></div>
  </div>

  <div class="sub">
    あなたのコード：<b id="myCode"></b>
  </div>

</div>


<div id="toast"></div>


<script>
// ============================================
// 状態
// ============================================
let sid = null;            // セッションID
let clientId = null;       // 匿名アカウントのコード
let myPresses = [];        // 自分が押した記録
const COOLDOWN_SEC = 30;   // 連打防止の秒数


// ============================================
// 起動時
// ============================================
window.onload = function () {
  sid = getSidFromUrl();

  if (!sid) {
    document.body.innerHTML =
      '<div class="card">QRコードを読み直してください</div>';
    return;
  }

  clientId = getClientId();

  if (clientId) {
    startMain();                                  // 2回目以降
  } else {
    document.getElementById("newCode").textContent = genCode();
    showScreen("screenCode");                     // 初回
  }
};

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(el => el.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}


// ============================================
// 匿名アカウントの作成 / 復元
// ============================================
function createAccount() {
  clientId = document.getElementById("newCode").textContent;
  saveClientId(clientId);
  startMain();
}

function restoreAccount() {
  const v = document.getElementById("restoreInput").value.trim().toUpperCase();
  if (v.length !== 6) {
    alert("6桁のコードを入力してください");
    return;
  }
  clientId = v;
  saveClientId(clientId);
  startMain();
}


// ============================================
// メイン画面の開始
// ============================================
async function startMain() {
  showScreen("screenMain");
  document.getElementById("myCode").textContent = clientId;

  try {
    const s = await apiGet("/api/sessions/" + sid);
    document.getElementById("lectureTitle").textContent = s.title;
  } catch (e) {
    showError(e.message);
  }

  loadMyPresses();
}


// ============================================
// ボタンを押したとき
// ============================================
async function press(type) {
  const btn = document.getElementById("btn-" + type);

  // すぐ反応を返す（体感速度が大事）
  toast("記録しました");
  if (navigator.vibrate) navigator.vibrate(50);
  startCooldown(btn, type);

  try {
    const res = await apiPost("/api/sessions/" + sid + "/presses", {
      type: type,
      client_id: clientId,
    });
    clearError();

    myPresses.push({ type: type, elapsed_sec: res.elapsed_sec });
    renderLog();
  } catch (e) {
    showError(e.message);
  }
}


// ============================================
// 30秒クールダウン
// ============================================
function startCooldown(btn, type) {
  btn.disabled = true;
  let left = COOLDOWN_SEC;
  btn.textContent = "あと" + left + "秒";

  const t = setInterval(() => {
    left--;
    if (left <= 0) {
      clearInterval(t);
      btn.disabled = false;
      btn.textContent = TYPE_LABEL[type];
    } else {
      btn.textContent = "あと" + left + "秒";
    }
  }, 1000);
}


// ============================================
// 自分の記録
// ============================================
async function loadMyPresses() {
  try {
    myPresses = await apiGet(
      "/api/sessions/" + sid + "/presses?client_id=" + clientId
    );
  } catch (e) {
    myPresses = [];
  }
  renderLog();
}

function renderLog() {
  const box = document.getElementById("log");

  if (myPresses.length === 0) {
    box.innerHTML = '<p class="note">まだ押した記録はありません</p>';
    return;
  }

  const sorted = myPresses.slice().sort((a, b) => b.elapsed_sec - a.elapsed_sec);

  box.innerHTML = sorted.map(p => `
    <div class="log-item">
      <div class="log-dot" style="background:${TYPE_COLOR[p.type]}"></div>
      <div class="log-time">${fmtMin(p.elapsed_sec)}</div>
      <div>${TYPE_LABEL[p.type]}</div>
    </div>
  `).join("");
}


// ============================================
// トースト・エラー
// ============================================
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1200);
}

function showError(msg) {
  document.getElementById("error").textContent = "エラー: " + msg;
}
function clearError() {
  document.getElementById("error").textContent = "";
}
</script>

</body>
</html>
